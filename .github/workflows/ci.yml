name: CI

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Check bibliography and citation consistency
        run: uv run python -m scaling_law_analysis.references --check

      - name: Check reference regression tests
        run: uv run pytest tests/test_references.py -q
