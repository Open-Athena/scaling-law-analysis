name: Deploy Article

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R results/site/. _site/
          cp results/article/figures/compute_allocation_errors/compute_allocation_errors.png _site/assets/compute-allocation-errors.png
          cp results/post/post.html _site/post.html
          cp results/article/article_standalone.html _site/article.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site"
